[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-compiler"
version = "0.3.0"
description = "Read a written policy and produce executable governance norms."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "flxk1" }]
dependencies = []

# The loomground planes are optional enrichment, consumed behind availability checks.
# The compiler runs without any of them, degrading to advisory extraction.
[project.optional-dependencies]
grounded = [
    "loomground-deontic",
    "loomground-norm",
    "loomground-ingest",
    "loomground-governance",
]
test = ["pytest"]

[project.scripts]
policy-compiler = "policy_compiler.cli:main"

[tool.setuptools.packages.find]
include = ["policy_compiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
