[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-compiler"
version = "0.3.0"
description = "Read a written policy and produce executable governance norms."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "flxk1" }]
dependencies = []

# The loomground planes are optional enrichment, consumed behind availability checks.
# The compiler runs without any of them, degrading to advisory extraction.
[project.optional-dependencies]
grounded = [
    "loomground-deontic @ git+https://github.com/flxk1/loomground-deontic@loomground-deontic-v0.2.1",
    "loomground-norm @ git+https://github.com/flxk1/loomground-norm@norm-v0.1.1",
    "loomground-ingest @ git+https://github.com/flxk1/loomground-ingest@loomground-ingest-v0.3.0",
    "loomground-governance @ git+https://github.com/flxk1/loomground-governance@loomground-governance-v0.11.1",
    "loomground-factual @ git+https://github.com/flxk1/loomground-factual@factual-v0.1.0",
    "loomground-solver @ git+https://github.com/flxk1/loomground-solver@solver-v0.6.0",
]
test = ["pytest"]

[project.scripts]
policy-compiler = "policy_compiler.cli:main"

[tool.setuptools.packages.find]
include = ["policy_compiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
